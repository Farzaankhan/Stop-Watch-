<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="clock-container">
    <h1 id="hell">DIGITAL CLOCK</h1>

    <div class="clock">
        <p id="pera">00:00:00</p>
    </div>

    <div class="buttons">
        <button onclick="plus()">Increase Time</button>
        <button onclick="minus()">Decrease Time</button>
        <button onclick="reset()">CLEAR</button>
        <button onclick="start()">START</button>
        <button onclick="stop()" id="btn">STOP</button>
    </div>
</div>

    <script src="stop.js"></script>
</body>
</html>
